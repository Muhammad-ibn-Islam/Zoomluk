<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Конференц-комната Ultimate (Mobile)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        .log-container::-webkit-scrollbar { width: 4px; }
        .log-container::-webkit-scrollbar-track { background: transparent; }
        .log-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .video-mirror { transform: scaleX(-1); }
        .video-normal { transform: scaleX(1); }
        
        #audioLevelBar { transition: height 0.05s ease-out; }

        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }

        @keyframes pulse-red {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .animate-pulse-red { animation: pulse-red 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        @keyframes flash-animation {
            0% { opacity: 0.8; }
            100% { opacity: 0; }
        }
        .flash-effect { animation: flash-animation 0.5s ease-out forwards; }

        .filter-grayscale { filter: grayscale(100%); }
        .filter-sepia { filter: sepia(0.8); }
        .filter-contrast { filter: contrast(150%) brightness(1.1); }
        .filter-invert { filter: invert(100%); }
        .filter-blur { filter: blur(4px); }
        .filter-blur.video-mirror { transform: scaleX(-1) scale(1.05); } 
        .filter-blur.video-normal { transform: scale(1.05); } 

        #chatSidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        #lobbyScreen { transition: opacity 0.5s ease-in-out, visibility 0.5s; }
        .hidden-opacity { opacity: 0; visibility: hidden; }
        
        .video-grid-1 { grid-template-columns: 1fr; }
        .video-grid-2 { grid-template-columns: 1fr 1fr; }
        @media (max-width: 640px) {
            .video-grid-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        }
    </style>
</head>
<body class="bg-slate-100 h-[100dvh] flex flex-col items-center justify-center p-2 sm:p-4 font-sans text-slate-800 overflow-hidden relative">

    <!-- ЛОББИ -->
    <div id="lobbyScreen" class="absolute inset-0 bg-slate-100/95 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-2xl w-full max-w-md text-center transform transition-all scale-100">
            <h2 class="text-xl sm:text-2xl font-bold mb-2 text-slate-800">Добро пожаловать</h2>
            <p class="text-slate-500 mb-6 sm:mb-8 text-sm">Настройте профиль</p>
            
            <div class="mb-6 flex justify-center">
                <label class="relative cursor-pointer group tap-highlight-transparent">
                    <div id="lobbyAvatarPreview" class="w-24 h-24 sm:w-32 sm:h-32 rounded-full bg-slate-200 flex items-center justify-center overflow-hidden border-4 border-white shadow-lg group-hover:border-indigo-100 transition-colors relative">
                        <span id="lobbyAvatarInitial" class="text-3xl sm:text-4xl text-slate-400 font-bold select-none">?</span>
                        <img id="lobbyAvatarImg" class="w-full h-full object-cover hidden absolute inset-0" />
                    </div>
                    <div class="absolute bottom-0 right-0 bg-indigo-600 text-white p-2 rounded-full shadow-md hover:bg-indigo-700 transition-colors">
                        <i data-lucide="camera" class="w-5 h-5"></i>
                    </div>
                    <input type="file" id="avatarInput" accept="image/*" class="hidden" onchange="handleAvatarUpload(this)">
                </label>
            </div>

            <div class="mb-4 text-left">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Ваше имя</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i data-lucide="user" class="h-5 w-5 text-slate-400"></i></div>
                    <input type="text" id="nameInput" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50 text-base" placeholder="Введите имя..." oninput="updateInitial(this.value)">
                </div>
            </div>

            <div class="mb-6 text-left">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">ID встречи</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i data-lucide="hash" class="h-5 w-5 text-slate-400"></i></div>
                    <input type="text" id="meetingIdInput" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50 text-base" placeholder="Оставьте пустым для новой">
                </div>
            </div>

            <button onclick="joinMeeting()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-indigo-200 flex items-center justify-center gap-2">
                <span>Войти</span> <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <!-- Основной контейнер -->
    <div class="bg-white w-full max-w-6xl h-full sm:h-[90vh] sm:rounded-2xl shadow-xl overflow-hidden flex flex-col relative z-10">
        
        <!-- Шапка -->
        <div class="p-3 sm:p-4 border-b border-slate-100 flex justify-between items-center bg-white shrink-0">
            <div class="flex items-center gap-2 sm:gap-4 overflow-hidden">
                <div class="min-w-0">
                    <h1 class="text-lg sm:text-xl font-bold text-slate-800 flex items-center gap-2 truncate">
                        <i data-lucide="users" class="w-5 h-5 text-indigo-600 shrink-0"></i>
                        <span class="truncate">Встреча</span>
                    </h1>
                </div>
                <button id="btnMeetingInfo" onclick="copyMeetingId()" class="hidden flex items-center gap-2 px-2 py-1.5 bg-indigo-50 text-indigo-600 rounded-lg text-xs font-medium hover:bg-indigo-100 active:bg-indigo-200 transition-colors shrink-0 max-w-[120px]" title="Скопировать ID">
                    <span id="displayMeetingId" class="truncate">ID...</span> <i data-lucide="copy" class="w-3 h-3 shrink-0"></i>
                </button>
            </div>
            <div id="statusIndicator" class="flex items-center gap-1.5 px-2 py-1 rounded-full bg-slate-100 text-slate-500 text-[10px] sm:text-xs font-medium shrink-0">
                <div class="w-1.5 h-1.5 rounded-full bg-slate-400"></div> Ожидание
            </div>
        </div>

        <!-- Контент -->
        <div class="flex flex-1 overflow-hidden relative">
            
            <!-- Видео Сетка -->
            <div id="videoGrid" class="relative flex-1 bg-slate-900 grid video-grid-1 gap-0.5 sm:gap-1 p-0.5 sm:p-1 overflow-hidden">
                
                <!-- Локальное -->
                <div class="relative w-full h-full bg-black rounded sm:rounded-lg overflow-hidden flex items-center justify-center group">
                    <video id="webcamVideo" class="w-full h-full object-cover video-mirror hidden transition-all duration-500" autoplay playsinline muted></video>
                    <video id="rawVideo" class="absolute inset-0 w-1 h-1 opacity-0 pointer-events-none -z-10" autoplay playsinline muted></video>
                    <canvas id="chromaCanvas" class="hidden"></canvas>

                    <div id="placeholder" class="text-slate-500 flex flex-col items-center z-10 p-4 text-center">
                        <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-slate-800 flex items-center justify-center mb-2 sm:mb-4 border-4 border-slate-700 relative overflow-hidden shadow-2xl">
                            <img id="mainAvatarImg" class="w-full h-full object-cover hidden absolute inset-0 z-0" />
                            <span id="mainAvatarInitial" class="text-4xl sm:text-5xl text-slate-300 font-bold z-10 relative select-none">?</span>
                            <div id="avatarRing" class="absolute inset-0 rounded-full border-4 border-emerald-500/0 transition-all duration-75 z-20"></div>
                        </div>
                        <h3 id="mainUserName" class="text-base sm:text-lg font-bold text-white mb-1 shadow-black drop-shadow-md truncate max-w-[150px]">Вы</h3>
                        <span id="placeholderText" class="text-xs text-slate-400">Камера выключена</span>
                    </div>

                    <div id="flashOverlay" class="absolute inset-0 bg-white pointer-events-none opacity-0 z-40"></div>
                    <div class="absolute left-2 sm:left-4 bottom-2 sm:bottom-4 top-2 sm:top-4 w-1.5 bg-slate-800/50 rounded-full overflow-hidden flex flex-col justify-end z-20 backdrop-blur-sm border border-white/10">
                        <div id="audioLevelBar" class="w-full bg-emerald-500 h-0 opacity-80 shadow-[0_0_10px_rgba(16,185,129,0.5)]"></div>
                    </div>
                    <div id="muteOverlay" class="absolute bottom-2 sm:bottom-4 right-2 sm:right-4 bg-red-600 text-white p-1.5 rounded-full hidden shadow-lg">
                        <i data-lucide="mic-off" class="w-3 h-3"></i>
                    </div>
                </div>

                <!-- Удаленное -->
                <div id="remoteVideoContainer" class="relative w-full h-full bg-slate-800 rounded sm:rounded-lg overflow-hidden flex items-center justify-center hidden">
                    <video id="remoteVideo" class="w-full h-full object-cover" autoplay playsinline></video>
                    
                    <!-- Кнопка ручного запуска -->
                    <button id="btnPlayRemote" onclick="playRemoteVideo()" class="hidden absolute inset-0 z-20 flex items-center justify-center bg-black/50 text-white font-bold hover:bg-black/70 transition-colors">
                        <div class="bg-indigo-600 p-4 rounded-full shadow-lg flex items-center gap-2 animate-bounce">
                            <i data-lucide="play" class="w-6 h-6 fill-current"></i> 
                            <span>Нажмите, чтобы видеть</span>
                        </div>
                    </button>

                    <div id="remotePlaceholder" class="text-slate-500 flex flex-col items-center z-10">
                        <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-slate-700 flex items-center justify-center mb-3">
                            <i data-lucide="user" class="w-8 h-8 sm:w-10 sm:h-10 text-slate-400"></i>
                        </div>
                        <span class="text-xs sm:text-sm text-slate-400">Ожидание...</span>
                    </div>
                    <div class="absolute bottom-2 left-2 sm:bottom-4 sm:left-4 bg-black/50 px-2 py-1 rounded text-white text-[10px] sm:text-xs backdrop-blur-md">Собеседник</div>
                </div>

                <!-- Индикаторы -->
                <div id="recordingIndicator" class="absolute top-2 right-2 sm:top-4 sm:right-4 bg-red-600/90 text-white px-2 py-1 sm:px-3 sm:py-1 rounded-full text-[10px] sm:text-xs font-medium hidden flex items-center gap-1.5 shadow-lg z-30 animate-pulse-red pointer-events-none">
                    <div class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-white"></div>REC <span id="recTimer" class="font-mono ml-1">00:00</span>
                </div>
                <div id="pipIndicator" class="absolute top-2 left-2 sm:top-4 sm:left-4 bg-blue-600/90 text-white px-2 py-1 sm:px-3 sm:py-1 rounded-full text-[10px] sm:text-xs font-medium hidden flex items-center gap-1.5 shadow-lg z-20 pointer-events-none">
                    <i data-lucide="external-link" class="w-3 h-3"></i> PiP
                </div>
                <div id="chromaIndicator" class="absolute top-8 left-2 sm:top-12 sm:left-4 bg-emerald-600/90 text-white px-2 py-1 sm:px-3 sm:py-1 rounded-full text-[10px] sm:text-xs font-medium hidden flex items-center gap-1.5 shadow-lg z-20 pointer-events-none">
                    <i data-lucide="layers" class="w-3 h-3"></i> Chroma
                </div>
                <div id="screenShareOverlay" class="absolute top-14 left-2 sm:top-20 sm:left-4 bg-indigo-600 text-white px-2 py-1 sm:px-3 sm:py-1 rounded-full text-[10px] sm:text-xs font-medium hidden flex items-center gap-1.5 shadow-lg z-20 pointer-events-none">
                    <i data-lucide="monitor" class="w-3 h-3"></i> Экран
                </div>

                <!-- Ошибка (Обновленный Overlay) -->
                <div id="errorOverlay" class="absolute inset-0 bg-black/95 flex flex-col items-center justify-center text-white hidden p-6 text-center z-50">
                    <i data-lucide="wifi-off" class="w-16 h-16 text-red-500 mb-4 animate-pulse"></i>
                    <h3 class="font-bold text-2xl mb-2 text-white">Ошибка подключения</h3>
                    <p id="errorMessage" class="text-slate-300 text-base mb-8 max-w-sm leading-relaxed">
                        Не удалось соединиться с сервером.
                    </p>
                    <div class="flex gap-4">
                        <button onclick="window.location.reload()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition flex items-center gap-2">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Обновить
                        </button>
                        <button onclick="hideError()" class="px-6 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-medium transition">
                            Закрыть
                        </button>
                    </div>
                </div>
            </div>

            <!-- Чат -->
            <div id="chatSidebar" class="absolute right-0 top-0 bottom-0 w-full sm:w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full flex flex-col z-40 transition-transform duration-300">
                <div class="p-3 sm:p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <h3 class="font-bold text-slate-700 flex items-center gap-2">
                        <i data-lucide="message-square" class="w-4 h-4"></i> Чат
                    </h3>
                    <button onclick="toggleChat()" class="p-2 text-slate-400 hover:text-slate-600 active:bg-slate-200 rounded-full">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <div id="chatMessages" class="flex-1 overflow-y-auto p-3 sm:p-4 space-y-3 sm:space-y-4 bg-slate-50/50">
                    <div class="text-center text-xs text-slate-400 my-4">Начало чата</div>
                </div>
                <div class="p-3 border-t border-slate-200 bg-white shrink-0">
                    <div id="filePreviewArea" class="hidden mb-2 px-2 py-1 bg-slate-100 rounded text-xs flex items-center justify-between">
                        <span id="previewFileName" class="truncate max-w-[180px]">file.png</span>
                        <button onclick="clearFileSelection()" class="text-slate-500 hover:text-red-500 p-1"><i data-lucide="x" class="w-3 h-3"></i></button>
                    </div>
                    <div class="flex gap-2 items-end">
                        <label class="p-2 text-slate-400 hover:text-indigo-600 active:text-indigo-800 cursor-pointer transition-colors" title="Файл">
                            <i data-lucide="paperclip" class="w-5 h-5"></i>
                            <input type="file" id="chatFileInput" class="hidden" onchange="handleFileSelect(this)">
                        </label>
                        <textarea id="chatInput" rows="1" class="flex-1 bg-slate-100 border-0 rounded-lg px-3 py-2 text-base sm:text-sm focus:ring-2 focus:ring-indigo-500 resize-none max-h-24" placeholder="Сообщение..."></textarea>
                        <button onclick="sendMessage()" class="p-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 active:scale-95 transition-all shadow-md">
                            <i data-lucide="send" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Панель управления -->
        <div class="p-3 sm:p-4 bg-slate-50 border-b border-slate-200 flex flex-col items-center gap-3 shrink-0">
            
            <div class="flex justify-center gap-2 sm:gap-3 flex-wrap">
                <button id="btnPower" class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-full bg-emerald-600 hover:bg-emerald-700 text-white transition shadow-lg" title="Старт">
                    <i data-lucide="power" class="w-5 h-5"></i>
                </button>
                <div class="w-px h-10 bg-slate-300 mx-1 hidden sm:block"></div>
                <button id="btnMic" class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-full bg-slate-200 text-slate-400 cursor-not-allowed transition" disabled><i data-lucide="mic" class="w-5 h-5"></i></button>
                <button id="btnCam" class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-full bg-slate-200 text-slate-400 cursor-not-allowed transition" disabled><i data-lucide="video" class="w-5 h-5"></i></button>
                <button id="btnShare" class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-full bg-slate-100 hover:bg-indigo-100 text-slate-600 transition group hidden sm:flex" title="Экран"><i data-lucide="monitor-up" class="w-5 h-5"></i></button>
                <div class="w-px h-10 bg-slate-300 mx-1 hidden sm:block"></div>
                <button id="btnRecord" class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-full bg-slate-200 text-slate-400 cursor-not-allowed transition group" title="Запись" disabled>
                    <div class="w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-current group-hover:scale-110"></div>
                </button>
                <button id="btnSnapshot" class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-full bg-slate-200 text-slate-400 cursor-not-allowed transition hover:bg-indigo-50" title="Фото" disabled>
                    <i data-lucide="camera" class="w-5 h-5"></i>
                </button>
                <button id="btnPip" class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-full bg-slate-200 text-slate-400 cursor-not-allowed transition hover:bg-blue-50 hidden sm:flex" title="PiP" disabled>
                    <i data-lucide="picture-in-picture-2" class="w-5 h-5"></i>
                </button>
                <button id="btnChroma" class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-full bg-slate-200 text-slate-400 cursor-not-allowed transition hover:bg-emerald-50 hidden sm:flex" title="Chroma" disabled>
                    <i data-lucide="layers" class="w-5 h-5"></i>
                </button>
                <button id="btnChat" class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-full bg-slate-100 hover:bg-indigo-100 text-slate-600 transition relative ml-1" title="Чат">
                    <i data-lucide="message-square" class="w-5 h-5"></i>
                    <span id="chatBadge" class="absolute top-0 right-0 w-2.5 h-2.5 sm:w-3 sm:h-3 bg-red-500 rounded-full border-2 border-white hidden"></span>
                </button>
            </div>

            <!-- Настройки -->
            <div id="deviceSettings" class="hidden w-full max-w-4xl grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-3 pt-2 border-t border-slate-200 animate-in slide-in-from-top-2 duration-300">
                <div class="relative"><div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i data-lucide="mic" class="h-4 w-4 text-slate-400"></i></div><select id="audioSource" class="block w-full pl-9 pr-8 py-2 text-xs sm:text-sm border-slate-300 focus:ring-indigo-500 rounded-lg bg-white shadow-sm appearance-none border text-slate-700 truncate"><option value="" disabled selected>Микрофоны...</option></select></div>
                <div class="relative"><div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i data-lucide="video" class="h-4 w-4 text-slate-400"></i></div><select id="videoSource" class="block w-full pl-9 pr-8 py-2 text-xs sm:text-sm border-slate-300 focus:ring-indigo-500 rounded-lg bg-white shadow-sm appearance-none border text-slate-700 truncate"><option value="" disabled selected>Камеры...</option></select></div>
                <div class="relative hidden sm:block"><div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i data-lucide="wand-2" class="h-4 w-4 text-indigo-500"></i></div><select id="filterSource" class="block w-full pl-9 pr-8 py-2 text-xs sm:text-sm border-indigo-200 focus:ring-indigo-500 rounded-lg bg-indigo-50 shadow-sm appearance-none border text-indigo-900 font-medium truncate"><option value="none" selected>Эффекты...</option><option value="grayscale">Ч/Б</option><option value="sepia">Сепия</option><option value="contrast">Контраст</option><option value="blur">Blur</option></select></div>
            </div>
        </div>

        <!-- Логи -->
        <div class="bg-slate-900 text-slate-300 p-2 sm:p-4 font-mono text-[10px] sm:text-xs w-full h-24 sm:h-32 overflow-hidden flex flex-col shrink-0">
            <div class="flex justify-between items-center mb-1">
                <span class="uppercase tracking-wider font-bold text-slate-500">Система</span>
                <button id="clearLogs" class="text-indigo-400 hover:underline px-2">Очистить</button>
            </div>
            <div id="logContainer" class="log-container flex-1 overflow-y-auto space-y-1 p-1 sm:p-2 bg-slate-950/50 rounded border border-slate-800">
                <div class="text-slate-600 italic">Нажмите кнопку питания...</div>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        // Elements
        const videoElement = document.getElementById('webcamVideo');
        const rawVideo = document.getElementById('rawVideo');
        const chromaCanvas = document.getElementById('chromaCanvas');
        const remoteVideo = document.getElementById('remoteVideo');
        const remoteVideoContainer = document.getElementById('remoteVideoContainer');
        const btnPlayRemote = document.getElementById('btnPlayRemote');
        const videoGrid = document.getElementById('videoGrid');
        const remotePlaceholder = document.getElementById('remotePlaceholder');
        const placeholder = document.getElementById('placeholder');
        const errorOverlay = document.getElementById('errorOverlay');
        const errorMessage = document.getElementById('errorMessage');
        const logContainer = document.getElementById('logContainer');
        const statusIndicator = document.getElementById('statusIndicator');
        const muteOverlay = document.getElementById('muteOverlay');
        const screenShareOverlay = document.getElementById('screenShareOverlay');
        const recordingIndicator = document.getElementById('recordingIndicator');
        const pipIndicator = document.getElementById('pipIndicator');
        const chromaIndicator = document.getElementById('chromaIndicator');
        const flashOverlay = document.getElementById('flashOverlay');
        const recTimer = document.getElementById('recTimer');
        
        const audioLevelBar = document.getElementById('audioLevelBar');
        const avatarRing = document.getElementById('avatarRing');
        const deviceSettings = document.getElementById('deviceSettings');
        const audioSelect = document.getElementById('audioSource');
        const videoSelect = document.getElementById('videoSource');
        const filterSelect = document.getElementById('filterSource');

        // Chat
        const chatSidebar = document.getElementById('chatSidebar');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const btnChat = document.getElementById('btnChat');
        const chatBadge = document.getElementById('chatBadge');
        const chatFileInput = document.getElementById('chatFileInput');
        const filePreviewArea = document.getElementById('filePreviewArea');
        const previewFileName = document.getElementById('previewFileName');

        // Lobby
        const lobbyScreen = document.getElementById('lobbyScreen');
        const lobbyAvatarImg = document.getElementById('lobbyAvatarImg');
        const lobbyAvatarInitial = document.getElementById('lobbyAvatarInitial');
        const nameInput = document.getElementById('nameInput');
        const meetingIdInput = document.getElementById('meetingIdInput');
        const mainAvatarImg = document.getElementById('mainAvatarImg');
        const mainAvatarInitial = document.getElementById('mainAvatarInitial');
        const mainUserName = document.getElementById('mainUserName');
        const btnMeetingInfo = document.getElementById('btnMeetingInfo');
        const displayMeetingId = document.getElementById('displayMeetingId');

        // Buttons
        const btnPower = document.getElementById('btnPower');
        const btnMic = document.getElementById('btnMic');
        const btnCam = document.getElementById('btnCam');
        const btnShare = document.getElementById('btnShare');
        const btnRecord = document.getElementById('btnRecord');
        const btnSnapshot = document.getElementById('btnSnapshot');
        const btnPip = document.getElementById('btnPip');
        const btnChroma = document.getElementById('btnChroma');

        // State
        let localStream = null;
        let screenStream = null;
        let chromaStream = null;
        let isStreamActive = false;
        let isVideoEnabled = true;
        let isAudioEnabled = true;
        let isScreenSharing = false;
        let isRecording = false;
        let isChromaActive = false;
        let isChatOpen = false;
        let currentFilter = 'none';
        let selectedFile = null;
        let userName = "Гость";
        let userAvatarUrl = null;
        let meetingId = null;
        let peer = null;
        let conn = null; 
        let call = null; 
        
        let audioContext = null;
        let analyser = null;
        let microphone = null;
        let animationFrameId = null;
        let chromaAnimationFrameId = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let recordStartTime = 0;
        let recordInterval = null;

        function addLog(msg, type = 'info') {
            if (logContainer.querySelector('.italic')) logContainer.innerHTML = '';
            const div = document.createElement('div');
            const time = new Date().toLocaleTimeString('ru-RU', { hour12: false });
            let color = 'text-slate-300';
            if (type === 'err') color = 'text-red-400';
            if (type === 'ok') color = 'text-emerald-400';
            if (type === 'warn') color = 'text-amber-400';
            if (type === 'rec') color = 'text-rose-400 font-bold';
            if (type === 'chat') color = 'text-indigo-300';
            if (type === 'peer') color = 'text-sky-400 font-bold';

            div.className = `flex gap-2 ${color} border-b border-slate-800/30 pb-0.5`;
            div.innerHTML = `<span class="opacity-50 select-none shrink-0">[${time}]</span> <span class="font-bold opacity-80 w-8 shrink-0 text-[10px]">${type.toUpperCase()}</span> <span class="break-all">${msg}</span>`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        document.getElementById('clearLogs').onclick = () => logContainer.innerHTML = '<div class="text-slate-600 italic">Журнал очищен</div>';

        // --- PEERJS FIX (Notify user about VPN) ---
        function initPeer(targetId = null, retryCount = 0) {
            if (peer && !peer.destroyed) peer.destroy();
            addLog(`Инициализация P2P${retryCount>0?` (Попытка ${retryCount+1})`:''}...`, 'peer');
            const peerConfig = {
                debug: 1,
                config: { 
                    iceServers: [ 
                        { urls: 'stun:stun.l.google.com:19302' }, 
                        { urls: 'stun:global.stun.twilio.com:3478' },
                        { urls: 'stun:stun.yandex.ru:19302' }
                    ] 
                }
            };
            try { peer = new Peer(null, peerConfig); } catch(e) { handleError(e); return; }
            peer.on('open', (id) => {
                meetingId = id; addLog(`ID: ${id}`, 'peer');
                displayMeetingId.innerText = `ID: ${id}`; btnMeetingInfo.classList.remove('hidden');
                if (targetId) { addLog(`Соединение с ${targetId}`, 'peer'); connectToPeer(targetId); }
            });
            peer.on('connection', (c) => { conn = c; handleDataConnection(conn); });
            peer.on('call', (incomingCall) => {
                addLog('Входящий звонок', 'peer');
                const streamToSend = isChromaActive ? chromaStream : (isScreenSharing ? screenStream : localStream);
                if (streamToSend) { incomingCall.answer(streamToSend); } 
                else if (localStream) { incomingCall.answer(localStream); }
                else {
                    navigator.mediaDevices.getUserMedia({video:true, audio:true}).then(s => {
                        localStream = s; gotStream(s); incomingCall.answer(s);
                    }).catch(e => incomingCall.answer()); 
                }
                handleCallStream(incomingCall);
            });
            peer.on('error', (err) => { 
                console.error(err);
                addLog(`Peer Error: ${err.type}`, 'err');
                
                // === ИСПРАВЛЕННАЯ ЛОГИКА УВЕДОМЛЕНИЯ О VPN ===
                if (['server-error', 'socket-error', 'network', 'webrtc'].includes(err.type)) {
                    if (retryCount < 2) { 
                        const timeout = 2000 * (retryCount + 1);
                        addLog(`Ошибка сети. Повтор через ${timeout/1000}с...`, 'warn');
                        setTimeout(() => initPeer(targetId, retryCount + 1), timeout);
                    } else {
                        // Показываем пользователю ЧЕТКОЕ окно с ошибкой вместо алерта
                        const msg = "<b>Сервер соединений недоступен.</b><br><br>Вероятно, он заблокирован вашим провайдером.<br>Для работы видеозвонка необходимо <b>включить VPN</b>.";
                        errorMessage.innerHTML = msg;
                        errorOverlay.classList.remove('hidden');
                        addLog('CRITICAL: Блокировка сети. Требуется VPN.', 'err');
                    }
                } else if (err.type === 'peer-unavailable') {
                    alert('Пользователь с таким ID не найден.');
                }
            });
        }

        function connectToPeer(targetId) {
            conn = peer.connect(targetId); handleDataConnection(conn);
            if (!localStream) {
                navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: true })
                    .then(stream => { gotStream(stream); isStreamActive = true; updateUIState(true); makeCall(targetId); })
                    .catch(err => { handleError(err); });
            } else { makeCall(targetId); }
        }

        function makeCall(targetId) {
            const streamToSend = isChromaActive ? chromaStream : (isScreenSharing ? screenStream : localStream);
            const outgoingCall = peer.call(targetId, streamToSend);
            handleCallStream(outgoingCall);
        }

        function handleCallStream(callSession) {
            call = callSession;
            call.on('stream', (remoteStream) => {
                if (remoteVideo.srcObject === remoteStream) return;
                addLog('Получен удаленный поток', 'peer');
                remoteVideo.srcObject = remoteStream;
                playRemoteVideo(); 
                remoteVideoContainer.classList.remove('hidden');
                remotePlaceholder.classList.add('hidden');
                videoGrid.classList.remove('video-grid-1'); videoGrid.classList.add('video-grid-2');
            });
            call.peerConnection.oniceconnectionstatechange = () => { addLog(`P2P статус: ${call.peerConnection.iceConnectionState}`, 'peer'); };
            call.on('close', () => {
                addLog('Отключено', 'peer');
                remoteVideoContainer.classList.add('hidden');
                videoGrid.classList.remove('video-grid-2'); videoGrid.classList.add('video-grid-1');
            });
        }

        function playRemoteVideo() {
            remoteVideo.play().then(() => { btnPlayRemote.classList.add('hidden'); })
            .catch(e => { addLog(`Автоплей: ${e.message}`, 'warn'); btnPlayRemote.classList.remove('hidden'); });
        }

        function handleDataConnection(connection) {
            connection.on('open', () => addLog('Чат готов', 'peer'));
            connection.on('data', (data) => { if (data.type === 'chat') receiveMessage(data); });
            connection.on('close', () => addLog('Чат закрыт', 'peer'));
        }

        function copyMeetingId() {
            navigator.clipboard.writeText(meetingId).then(() => {
                addLog('ID скопирован', 'info'); const orig = displayMeetingId.innerText; displayMeetingId.innerText = "Скопировано!"; setTimeout(() => displayMeetingId.innerText = orig, 2000);
            });
        }

        // --- DEVICES FIX (Keep Selection) ---
        async function getConnectedDevices() { 
            const devs = await navigator.mediaDevices.enumerateDevices();
            const curAudio = audioSelect.value; const curVideo = videoSelect.value;
            audioSelect.innerHTML='<option value="" disabled>Микрофоны...</option>'; videoSelect.innerHTML='<option value="" disabled>Камеры...</option>';
            devs.forEach(d=>{ const o=document.createElement('option'); o.value=d.deviceId; o.text=d.label||d.kind; if(d.kind==='audioinput') audioSelect.appendChild(o); else if(d.kind==='videoinput') videoSelect.appendChild(o); });
            if (localStream) {
                const at = localStream.getAudioTracks()[0]; const vt = localStream.getVideoTracks()[0];
                if (at && at.getSettings().deviceId) audioSelect.value = at.getSettings().deviceId; else if(curAudio) audioSelect.value = curAudio;
                if (vt && vt.getSettings().deviceId) videoSelect.value = vt.getSettings().deviceId; else if(curVideo) videoSelect.value = curVideo;
            }
            deviceSettings.classList.remove('hidden'); deviceSettings.classList.add('grid');
        }
        
        async function switchDevice() { 
            if(localStream) localStream.getTracks().forEach(t=>t.stop()); 
            try { const s=await navigator.mediaDevices.getUserMedia({ audio: {deviceId: audioSelect.value}, video: {deviceId: videoSelect.value, width:1280, height:720} }); gotStream(s); } catch(e){ handleError(e); }
        }
        audioSelect.onchange=switchDevice; videoSelect.onchange=switchDevice;

        // --- CORE ---
        function gotStream(stream) {
            localStream = stream; rawVideo.srcObject = stream; rawVideo.play().catch(e=>{});
            videoElement.srcObject = stream; isVideoEnabled = true; videoElement.classList.remove('hidden'); placeholder.classList.add('hidden');
            const at = stream.getAudioTracks(); if(at.length) { isAudioEnabled=true; initAudioVisualizer(stream); }
            updateUIState(true); getConnectedDevices();
        }

        async function startConference() {
            btnPower.disabled = true;
            try { const s=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720}, audio:true}); isStreamActive=true; gotStream(s); } 
            catch(e) { handleError(e); } finally { btnPower.disabled=false; }
        }

        // --- LOBBY, CHAT, CHROMA, UTILS (Standard) ---
        function handleAvatarUpload(input) { if (input.files && input.files[0]) { const reader = new FileReader(); reader.onload = (e) => { userAvatarUrl = e.target.result; lobbyAvatarImg.src = userAvatarUrl; lobbyAvatarImg.classList.remove('hidden'); lobbyAvatarInitial.classList.add('hidden'); mainAvatarImg.src = userAvatarUrl; mainAvatarImg.classList.remove('hidden'); mainAvatarInitial.classList.add('hidden'); }; reader.readAsDataURL(input.files[0]); } }
        function updateInitial(val) { if (!val) { lobbyAvatarInitial.textContent = "?"; mainAvatarInitial.textContent = "?"; } else { const c = val.charAt(0).toUpperCase(); lobbyAvatarInitial.textContent = c; mainAvatarInitial.textContent = c; } }
        function joinMeeting() { const val = nameInput.value.trim(); if (val) userName = val; mainUserName.textContent = userName; lobbyScreen.classList.add('hidden-opacity'); initPeer(meetingIdInput.value.trim() || null, 0); }
        function toggleChat() { isChatOpen = !isChatOpen; if (isChatOpen) { chatSidebar.classList.remove('translate-x-full'); chatBadge.classList.add('hidden'); btnChat.classList.add('bg-indigo-100', 'text-indigo-600'); setTimeout(() => chatInput.focus(), 300); } else { chatSidebar.classList.add('translate-x-full'); btnChat.classList.remove('bg-indigo-100', 'text-indigo-600'); } }
        btnChat.onclick = toggleChat; chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
        function handleFileSelect(input) { if (input.files[0]) { selectedFile = input.files[0]; filePreviewArea.classList.remove('hidden'); previewFileName.textContent = selectedFile.name; if(!isChatOpen) toggleChat(); } }
        function clearFileSelection() { selectedFile = null; chatFileInput.value = ''; filePreviewArea.classList.add('hidden'); }
        function sendMessage() { const text = chatInput.value.trim(); if (!text && !selectedFile) return; const data = { type: 'chat', sender: userName, text: text, time: new Date().toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'}), file: null }; if (selectedFile) { const reader = new FileReader(); reader.onload = (e) => { data.file = { name: selectedFile.name, type: selectedFile.type, data: e.target.result }; finalizeSendMessage(data); }; reader.readAsDataURL(selectedFile); } else { finalizeSendMessage(data); } }
        function finalizeSendMessage(data) { if (conn && conn.open) conn.send(data); else if(meetingId && !conn) addLog('Нет подключения к чату', 'warn'); renderMessage(data, true); chatInput.value = ''; clearFileSelection(); }
        function receiveMessage(data) { renderMessage(data, false); if (!isChatOpen) chatBadge.classList.remove('hidden'); }
        function renderMessage(data, isMe) { const msgDiv = document.createElement('div'); msgDiv.className = `flex flex-col ${isMe?'items-end':'items-start'} animate-in slide-in-from-bottom-2 duration-300`; const contentDiv = document.createElement('div'); contentDiv.className = `${isMe?'bg-indigo-600 text-white rounded-tr-none':'bg-white text-slate-800 border border-slate-200 rounded-tl-none'} rounded-2xl px-3 py-2 max-w-[90%] shadow-sm text-sm break-words`; if(!isMe) contentDiv.innerHTML += `<div class="text-[10px] text-indigo-500 mb-1 font-bold">${data.sender}</div>`; if(data.file) { const isImg = data.file.type.startsWith('image'); if(isImg) contentDiv.innerHTML += `<img src="${data.file.data}" class="rounded-lg max-h-32 object-cover cursor-pointer mb-1" onclick="window.open(this.src)">`; else contentDiv.innerHTML += `<a href="${data.file.data}" download="${data.file.name}" class="flex items-center gap-1 underline text-xs"><i data-lucide="file" class="w-3 h-3"></i> ${data.file.name}</a>`; } if(data.text) contentDiv.innerHTML += `<span>${data.text}</span>`; msgDiv.appendChild(contentDiv); msgDiv.innerHTML += `<div class="text-[9px] text-slate-400 mt-0.5 mx-1">${data.time}</div>`; chatMessages.appendChild(msgDiv); chatMessages.scrollTop = chatMessages.scrollHeight; lucide.createIcons(); }
        function toggleChroma() { if (isScreenSharing) return; if(isRecording) stopRecording(); isChromaActive = !isChromaActive; if (isChromaActive) { btnChroma.classList.replace('text-slate-400','text-emerald-600'); btnChroma.classList.replace('bg-slate-200','bg-emerald-100'); chromaIndicator.classList.remove('hidden'); startChromaProcessing(); } else { btnChroma.classList.replace('text-emerald-600','text-slate-400'); btnChroma.classList.replace('bg-emerald-100','bg-slate-200'); chromaIndicator.classList.add('hidden'); stopChromaProcessing(); } }
        function startChromaProcessing() { if (!localStream) return; const w = 320; const h = 180; chromaCanvas.width = w; chromaCanvas.height = h; const ctx = chromaCanvas.getContext('2d', { willReadFrequently: true }); const bgG = ctx.createLinearGradient(0,0,0,h); bgG.addColorStop(0,'#e2e8f0'); bgG.addColorStop(1,'#94a3b8'); const loop = () => { if (!isChromaActive) return; if (rawVideo.readyState === 0) { chromaAnimationFrameId = requestAnimationFrame(loop); return; } ctx.fillStyle = bgG; ctx.fillRect(0,0,w,h); ctx.drawImage(rawVideo, 0, 0, w, h); const frame = ctx.getImageData(0,0,w,h); const l = frame.data.length / 4; for (let i=0; i<l; i++) { const r=frame.data[i*4], g=frame.data[i*4+1], b=frame.data[i*4+2]; if (g>100 && g>r*1.4 && g>b*1.4) frame.data[i*4+3] = 0; } ctx.fillStyle = bgG; ctx.fillRect(0,0,w,h); ctx.putImageData(frame,0,0); chromaAnimationFrameId = requestAnimationFrame(loop); }; chromaAnimationFrameId = requestAnimationFrame(loop); const cs = chromaCanvas.captureStream(30); if(localStream.getAudioTracks().length) cs.addTrack(localStream.getAudioTracks()[0]); videoElement.srcObject = cs; chromaStream = cs; }
        function stopChromaProcessing() { if(chromaAnimationFrameId) cancelAnimationFrame(chromaAnimationFrameId); if(localStream) videoElement.srcObject = localStream; chromaStream = null; }
        function playShutterSound() { try{const c=new(window.AudioContext||window.webkitAudioContext);const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.type='square';o.frequency.setValueAtTime(800,c.currentTime);g.gain.setValueAtTime(0.1,c.currentTime);g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+0.1);o.start();o.stop(c.currentTime+0.1);}catch(e){} }
        async function takeSnapshot() { if(!videoElement.srcObject) return; playShutterSound(); flashOverlay.classList.add('flash-effect'); setTimeout(()=>flashOverlay.classList.remove('flash-effect'), 500); const c = document.createElement('canvas'); c.width = videoElement.videoWidth; c.height = videoElement.videoHeight; const ctx = c.getContext('2d'); ctx.save(); if(videoElement.classList.contains('video-mirror')){ ctx.translate(c.width,0); ctx.scale(-1,1); } if(currentFilter!=='none') ctx.filter = getComputedStyle(videoElement).filter; ctx.drawImage(videoElement,0,0); ctx.restore(); const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = `snap_${Date.now()}.png`; a.click(); }
        filterSelect.addEventListener('change', (e) => { currentFilter = e.target.value; videoElement.className = `w-full h-full object-cover transition-all duration-300 ${!isScreenSharing?'video-mirror':'video-normal'} filter-${currentFilter}`; });
        async function togglePip() { try { if (document.pictureInPictureElement) await document.exitPictureInPicture(); else if (document.pictureInPictureEnabled && videoElement.srcObject) await videoElement.requestPictureInPicture(); } catch(e){} }
        function toggleRecording() { isRecording ? stopRecording() : startRecording(); }
        function startRecording() { const s = isChromaActive ? chromaStream : (isScreenSharing ? screenStream : localStream); if(!s) return; recordedChunks=[]; mediaRecorder=new MediaRecorder(s); mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recordedChunks.push(e.data)}; mediaRecorder.onstop=saveRecording; mediaRecorder.start(); isRecording=true; recordingIndicator.classList.remove('hidden'); btnRecord.classList.add('text-red-600','bg-red-100'); recordStartTime=Date.now(); recordInterval=setInterval(updateTimer,1000); }
        function stopRecording() { if(mediaRecorder) mediaRecorder.stop(); isRecording=false; recordingIndicator.classList.add('hidden'); btnRecord.classList.remove('text-red-600','bg-red-100'); clearInterval(recordInterval); }
        function saveRecording() { const b=new Blob(recordedChunks,{type:'video/webm'}); if(b.size===0)return; const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=`rec_${Date.now()}.webm`; a.click(); }
        function updateTimer() { const d=Date.now()-recordStartTime; const m=Math.floor(d/60000); const s=Math.floor((d%60000)/1000); recTimer.textContent=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
        function stopConference() { if(isRecording) stopRecording(); if(isChromaActive) stopChromaProcessing(); if(isScreenSharing) stopScreenShare(); if(localStream) localStream.getTracks().forEach(t=>t.stop()); if(call) call.close(); stopAudioVisualizer(); localStream=null; videoElement.srcObject=null; isStreamActive=false; deviceSettings.classList.add('hidden'); deviceSettings.classList.remove('grid'); updateUIState(false); }
        async function toggleScreenShare() { if(isScreenSharing) { stopScreenShare(true); return; } try { screenStream=await navigator.mediaDevices.getDisplayMedia({video:true}); isScreenSharing=true; videoElement.srcObject=screenStream; videoElement.classList.replace('video-mirror','video-normal'); screenStream.getVideoTracks()[0].onended=()=>stopScreenShare(true); updateControlButtons(); } catch(e){ handleError(e); } }
        function stopScreenShare(restore) { if(screenStream) screenStream.getTracks().forEach(t=>t.stop()); isScreenSharing=false; videoElement.classList.replace('video-normal','video-mirror'); if(restore && localStream) videoElement.srcObject=localStream; updateControlButtons(); }
        function initAudioVisualizer(stream) { if(!stream.getAudioTracks().length) return; if(audioContext) audioContext.close(); audioContext=new(window.AudioContext||window.webkitAudioContext)(); analyser=audioContext.createAnalyser(); microphone=audioContext.createMediaStreamSource(stream); microphone.connect(analyser); const data=new Uint8Array(analyser.frequencyBinCount); const draw=()=>{ if(!isStreamActive) return; analyser.getByteFrequencyData(data); let sum=0; for(let i=0; i<data.length; i++) sum+=data[i]; const h=Math.min(100, (sum/data.length)*1.5); audioLevelBar.style.height=`${h}%`; avatarRing.style.borderColor=`rgba(16,185,129,${h>10?Math.min(1,h/50):0})`; animationFrameId=requestAnimationFrame(draw); }; draw(); }
        function stopAudioVisualizer() { if(animationFrameId) cancelAnimationFrame(animationFrameId); if(audioContext) audioContext.close(); audioLevelBar.style.height='0%'; }
        function toggleAudio() { if(localStream) { const t=localStream.getAudioTracks()[0]; if(t) { isAudioEnabled=!isAudioEnabled; t.enabled=isAudioEnabled; updateControlButtons(); } } }
        function toggleVideo() { if(localStream) { const t=localStream.getVideoTracks()[0]; if(t) { isVideoEnabled=!isVideoEnabled; t.enabled=isVideoEnabled; if(isVideoEnabled){videoElement.classList.remove('hidden'); placeholder.classList.add('hidden');} else {videoElement.classList.add('hidden'); placeholder.classList.remove('hidden');} updateControlButtons(); } } }
        function updateUIState(active) { const btns = [btnMic, btnCam, btnRecord, btnPip, btnSnapshot, btnChroma]; if(active) { btnPower.classList.replace('bg-emerald-600','bg-red-600'); statusIndicator.innerHTML='<div class="w-2 h-2 rounded-full bg-current animate-pulse"></div>В эфире'; btns.forEach(b=>{b.disabled=false; b.classList.remove('opacity-50','cursor-not-allowed');}); } else { btnPower.classList.replace('bg-red-600','bg-emerald-600'); statusIndicator.innerHTML='<div class="w-2 h-2 rounded-full bg-slate-400"></div>Ожидание'; btns.forEach(b=>{b.disabled=true; b.classList.add('opacity-50','cursor-not-allowed');}); videoElement.classList.add('hidden'); placeholder.classList.remove('hidden'); } updateControlButtons(); }
        function updateControlButtons() { if(isAudioEnabled) { btnMic.innerHTML='<i data-lucide="mic" class="w-5 h-5"></i>'; muteOverlay.classList.add('hidden'); } else { btnMic.innerHTML='<i data-lucide="mic-off" class="w-5 h-5"></i>'; btnMic.classList.add('text-red-600'); muteOverlay.classList.remove('hidden'); } if(isVideoEnabled) btnCam.innerHTML='<i data-lucide="video" class="w-5 h-5"></i>'; else { btnCam.innerHTML='<i data-lucide="video-off" class="w-5 h-5"></i>'; btnCam.classList.add('text-red-600'); } lucide.createIcons(); }
        function handleError(e) { errorMessage.innerText=e.message||"Error"; errorOverlay.classList.remove('hidden'); }
        function hideError() { errorOverlay.classList.add('hidden'); }

        btnPower.onclick = () => isStreamActive ? stopConference() : startConference();
        btnMic.onclick = toggleAudio; btnCam.onclick = toggleVideo; btnShare.onclick = toggleScreenShare;
        btnRecord.onclick = toggleRecording; btnPip.onclick = togglePip; btnSnapshot.onclick = takeSnapshot; btnChroma.onclick = toggleChroma;
    </script>
</body>
